name: Production smoke check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./backend
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          node -e "const m=require('./.next/server/server-reference-manifest.json'); console.log('Server Actions:', Object.keys(m.node || {}).length, Object.keys(m.edge || {}).length)"
          uvicorn vinted_assistant.app:app --host 127.0.0.1 --port 8000 &
          npm start -- --hostname 127.0.0.1 &
          curl --retry 12 --retry-connrefused --fail http://127.0.0.1:8000/openapi.json -o /dev/null
          curl --retry 12 --retry-connrefused --fail http://127.0.0.1:3000/ -o /tmp/page.html
          grep -qi '<html' /tmp/page.html
