[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-assistant-backend"
version = "0.2.0"
description = "Local Vinted listing drafts, dashboard backend and MCP stdio server"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.31.1,<1",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10,<13",
  "mcp==2.0.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]
barcode = ["pyzbar>=0.1.9,<1"]

[project.scripts]
vinted-assistant = "vinted_assistant.cli:entrypoint"
vinted-assistant-mcp = "vinted_assistant.mcp_server:entrypoint"

[project.urls]
Repository = "https://github.com/kessal001/vinted-assistant"
Issues = "https://github.com/kessal001/vinted-assistant/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinted_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
